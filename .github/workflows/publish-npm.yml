# Publishes the npm package amaca-design when a release tag is pushed (release/release.py tag).
# The package is built from the repo by release/npm.py; nothing in it is written by hand.
# Needs the repository secret NPM_TOKEN (an npm automation token).
# Run workflow (Actions tab) publishes a tag again by hand, e.g. after a failed run: it builds from that tag.
name: Publish to npm

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "The release tag to publish, e.g. v5.0.0"
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Build the package from the repo
        run: python3 release/npm.py build/npm
      - name: The tag is the version DESIGN.md states
        run: |
          v=$(node -p "require('./build/npm/package.json').version")
          if [ "v$v" != "$TAG" ]; then echo "tag $TAG, DESIGN.md $v"; exit 1; fi
      - name: Publish
        # ./ matters: without it npm reads build/npm as the GitHub repository build/npm
        run: npm publish ./build/npm --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
